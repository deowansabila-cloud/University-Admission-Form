<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <title>blog</title>
    </head>
    <body>
        <h1> University Admission Form</h1>
        <p> Fill out the form below to apply</p>
        <from>
        <!--1. Personal Information-->
        <h2> Personal Information </h2>
        <label> Full name:</label>
        <input type="text">
        <label> Email:</label>
        <input type="email">
        <label> Phone:</label>
        <input type="tel">
        <label> Date of Birth:</label>
        <input type="date">
        <!--2.Gender-->
        <h2> Gender</h2>
        <input type="radio">
        <label> Male</label>
        <input type="radio">
        <label> Female</label>
        <input type="radio">
        <label> Other</label>
        <!--3. Department-->
        <h2>Choose Department</h2>
        <select>
            <option>CSE</option>
            <option>EEE</option>
            <option>BBA</option>
            <option>English</option>
        </select>
        <!--4. Skills-->
        <h2>Skills</h2>
        <input type="checkbox">
        <label>HTML</label>
        <input type="checkbox">
        <label>CSS</label>
        <input type="checkbox">
        <label> JavaScript</label>
        <!--5. Address-->
        <h2> Address</h2>
        <textarea></textarea>
        <!--6. Submit-->
        <button type="submit">Submit Application</button>
        </from>
    </body>
      
</html>
